<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0c10"/>

  <!-- Globe ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#e8c547" stroke-width="2.5"/>

  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="20" ry="8"  fill="none" stroke="#e8c547" stroke-width="1.2" opacity="0.5"/>
  <line x1="12" y1="32" x2="52" y2="32"    stroke="#e8c547" stroke-width="1.2" opacity="0.5"/>

  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="8"  ry="20" fill="none" stroke="#e8c547" stroke-width="1.2" opacity="0.5"/>

  <!-- Gold lens dot in centre -->
  <circle cx="32" cy="32" r="4.5" fill="#e8c547"/>
  <circle cx="32" cy="32" r="2"   fill="#0a0c10"/>
</svg>
